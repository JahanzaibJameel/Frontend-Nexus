  <script>
    if (location.protocol === 'file:') {
      document.open();
      document.write(`<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Server Required</title><style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#0f172a;color:#e2e8f0;font-family:system-ui,-apple-system,sans-serif;padding:24px}
        .box{max-width:560px;width:100%;text-align:center}
        h1{font-size:2rem;margin-bottom:16px;color:#38bdf8}
        p{font-size:1.05rem;color:#94a3b8;line-height:1.6;margin-bottom:24px}
        code{display:block;background:#1e293b;border:1px solid rgba(148,163,184,0.18);border-radius:12px;padding:16px;color:#38bdf8;font-family:JetBrains Mono,monospace;font-size:0.95rem;margin-bottom:12px;text-align:left}
        a{color:#38bdf8}
        .note{font-size:0.85rem;color:#64748b;margin-top:16px}
      </style></head><body>
        <div class="box">
          <h1>Local Server Required</h1>
          <p>Frontend Nexus uses ES modules and a strict Content Security Policy. Opening index.html directly via file:// is blocked by browser security.</p>
          <code>python -m http.server 8000</code>
          <code>npx serve .</code>
          <p style="margin-top:20px">Then open <a href="http://localhost:8000">http://localhost:8000</a></p>
          <p class="note">Run the command from the <code>frontend-nexus/</code> directory, not the parent folder.</p>
        </div>
      </body></html>`);
      document.close();
      throw new Error('Stop');
    }
  </script>
