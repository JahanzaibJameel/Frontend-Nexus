<section class="page-shell">
  <div class="page-header"><h1>Settings</h1><p>Theme, language, and accessibility controls that persist across sessions.</p></div>
  <div class="settings-grid">
    <label class="form-field"><span>Theme</span><select id="theme-select"><option value="dark">Dark</option><option value="light">Light</option><option value="blue">Blue</option><option value="purple">Purple</option><option value="green">Green</option><option value="cyberpunk">Cyberpunk</option><option value="glassmorphism">Glass</option><option value="neumorphism">Neumorphic</option><option value="high-contrast">High Contrast</option></select></label>
    <label class="form-field"><span>Accent</span><input id="accent-color" type="color" value="#38bdf8" /></label>
    <label class="form-field"><span>Language</span><select id="lang-select"><option value="en">English</option><option value="es">Español</option><option value="fr">Français</option></select></label>
    <label class="form-field" style="flex-direction:row;gap:12px;align-items:center;"><input id="auto-theme" type="checkbox" style="width:auto;" /><span>Auto-switch theme with system preference</span></label>
    <p class="settings-note">Theme and language are saved to local storage and apply immediately.</p>
  </div>
</section>
