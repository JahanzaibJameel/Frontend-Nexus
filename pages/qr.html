<section class="page-shell">
  <div class="page-header">
    <h1>QR Code & Barcode Studio</h1>
    <p>Generate high-density QR codes (QRCode.js) and customizable industrial barcodes (JsBarcode) in real time.</p>
  </div>

  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px;">
    <!-- QR Code Generator Card -->
    <div style="background: var(--bg-surface); border-radius: 16px; border: 1px solid var(--border); padding: 24px; display: flex; flex-direction: column; align-items: center;">
      <h2 style="font-size: 1.25rem; font-weight: 700; margin-top: 0; margin-bottom: 16px; color: var(--text-primary);">QR Code Generator</h2>
      <div id="qrcode-container" style="background: #ffffff; padding: 16px; border-radius: 12px; min-width: 200px; min-height: 200px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px;"></div>

      <div style="width: 100%; display: grid; gap: 12px;">
        <div>
          <label style="display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 4px;">Content / URL</label>
          <input type="text" id="qr-input" value="https://github.com/frontend-nexus" style="width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-secondary); color: var(--text-primary);" />
        </div>
        <button id="download-qr-btn" class="btn" style="padding: 10px; background: var(--accent); color: #0f172a; font-weight: 700; border-radius: 8px; border: none; cursor: pointer; text-align: center;">
          ⬇ Download QR Code
        </button>
      </div>
    </div>

    <!-- Barcode Generator Card -->
    <div style="background: var(--bg-surface); border-radius: 16px; border: 1px solid var(--border); padding: 24px; display: flex; flex-direction: column; align-items: center;">
      <h2 style="font-size: 1.25rem; font-weight: 700; margin-top: 0; margin-bottom: 16px; color: var(--text-primary);">Barcode Generator</h2>
      <div style="background: #ffffff; padding: 16px; border-radius: 12px; min-width: 200px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; width: 100%;">
        <svg id="barcode-svg" style="max-width: 100%;"></svg>
      </div>

      <div style="width: 100%; display: grid; gap: 12px;">
        <div>
          <label style="display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 4px;">Barcode Value</label>
          <input type="text" id="barcode-input" value="NEXUS-2026-CODE" style="width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-secondary); color: var(--text-primary);" />
        </div>
        <div>
          <label style="display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 4px;">Format</label>
          <select id="barcode-format" style="width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-secondary); color: var(--text-primary);">
            <option value="CODE128">CODE128 (Standard)</option>
            <option value="EAN13">EAN13 (Numeric 12-13 digits)</option>
            <option value="UPC">UPC (12 digits)</option>
            <option value="CODE39">CODE39</option>
          </select>
        </div>
      </div>
    </div>
  </div>
</section>
