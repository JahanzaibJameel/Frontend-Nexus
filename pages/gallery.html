<section class="page-shell">
  <div class="page-header">
    <h1>Gallery</h1>
    <p>12 high-resolution photos with category filters, keyboard navigation, and a fully accessible lightbox.</p>
  </div>

  <div class="gallery-filters" id="gallery-filters" role="group" aria-label="Filter by category"></div>
  <div class="gallery-grid" id="gallery-grid" role="list" aria-label="Photo gallery"></div>

  <!-- Native dialog lightbox -->
  <dialog class="gallery-lightbox" id="gallery-lightbox" aria-modal="true" aria-label="Photo viewer">
    <img id="lb-img" src="" alt="" style="width:100%;max-height:70vh;object-fit:contain;display:block" />
    <div class="gallery-lightbox-footer">
      <button id="lb-prev" class="btn-secondary btn-sm" aria-label="Previous photo">← Prev</button>
      <span id="lb-caption" style="color:var(--text-secondary);font-size:0.9rem"></span>
      <button id="lb-next" class="btn-secondary btn-sm" aria-label="Next photo">Next →</button>
    </div>
    <button id="lb-close" aria-label="Close lightbox" style="position:absolute;top:14px;right:14px;background:rgba(0,0,0,0.5);color:#fff;border:none;border-radius:50%;width:36px;height:36px;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center">×</button>
  </dialog>
</section>
