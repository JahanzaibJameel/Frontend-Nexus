<section class="page-shell">
  <div class="page-header">
    <h1>Web Serial API</h1>
    <p>Connect to USB / Bluetooth serial devices directly from the browser.</p>
  </div>

  <div class="form-field" style="margin-bottom:16px;">
    <button class="btn" id="serial-connect-btn">Connect Serial Port</button>
    <button class="btn btn-secondary" id="serial-disconnect-btn" disabled>Disconnect</button>
  </div>

  <div style="display:flex;gap:8px;margin-bottom:12px;">
    <input id="serial-data" placeholder="Type to send…" style="flex:1;padding:8px;border-radius:6px;border:1px solid var(--border);background:var(--bg-secondary);color:var(--text-primary);" />
    <button class="btn btn-sm" id="serial-send-btn" disabled>Send</button>
  </div>

  <div id="serial-log" style="background:var(--bg-secondary);border-radius:8px;padding:12px;height:200px;overflow-y:auto;font-family:JetBrains Mono,monospace;font-size:0.85rem;color:var(--text-secondary);"></div>
</section>
