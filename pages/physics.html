<section class="page-shell">
  <div class="page-header">
    <h1>Physics</h1>
    <p>Rigid-body simulation with Matter.js. Click the canvas to spawn a ball; drag objects to interact.</p>
  </div>

  <div class="physics-card">
    <canvas id="physics-canvas" aria-label="Physics simulation canvas" role="img"></canvas>
    <div class="physics-toolbar">
      <button id="physics-add" aria-label="Add 8 new balls">+ Add Balls</button>
      <button id="physics-clear" class="btn-secondary" aria-label="Clear all balls">🗑 Clear</button>
    </div>
  </div>
</section>
