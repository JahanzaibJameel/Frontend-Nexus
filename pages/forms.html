<section class="page-shell">
  <div class="page-header">
    <h1>Forms</h1>
    <p>Real-time validation with JustValidate. Email, phone, password strength, and URL patterns.</p>
  </div>

  <app-tabs id="forms-tabs" labels='["Login","Register","Contact","Survey"]'>
    <div slot="panel-0">
      <form class="form-panel" id="form-login" novalidate aria-label="Login form">
        <h2 style="font-size:1.3rem">Sign In</h2>
        <div class="form-field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" name="email" placeholder="you@example.com" autocomplete="email" required />
        </div>
        <div class="form-field">
          <label for="login-pass">Password</label>
          <input type="password" id="login-pass" name="password" placeholder="••••••••" autocomplete="current-password" required />
        </div>
        <div class="checkbox-field form-field">
          <input type="checkbox" id="remember-me" />
          <label for="remember-me">Remember me</label>
        </div>
        <button type="submit" style="width:100%">Sign In</button>
        <div class="form-feedback" id="login-feedback" aria-live="polite"></div>
      </form>
    </div>

    <div slot="panel-1">
      <form class="form-panel" id="form-register" novalidate aria-label="Registration form">
        <h2 style="font-size:1.3rem">Create Account</h2>
        <div class="form-field">
          <label for="reg-name">Full Name</label>
          <input type="text" id="reg-name" placeholder="Jane Doe" autocomplete="name" required />
        </div>
        <div class="form-field">
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" placeholder="you@example.com" autocomplete="email" required />
        </div>
        <div class="form-field">
          <label for="reg-phone">Phone</label>
          <input type="tel" id="reg-phone" placeholder="+1 555 000 0000" autocomplete="tel" />
        </div>
        <div class="form-field">
          <label for="reg-pass">Password <span style="color:var(--text-muted);font-weight:400">(8+ chars)</span></label>
          <input type="password" id="reg-pass" placeholder="••••••••" autocomplete="new-password" required />
          <div id="pass-strength" style="height:4px;border-radius:2px;background:var(--bg-muted);margin-top:6px">
            <div id="pass-strength-bar" style="height:100%;border-radius:2px;width:0;transition:width .3s,background .3s"></div>
          </div>
        </div>
        <div class="form-field">
          <label for="reg-pass-confirm">Confirm Password</label>
          <input type="password" id="reg-pass-confirm" placeholder="••••••••" autocomplete="new-password" required />
        </div>
        <button type="submit" style="width:100%">Create Account</button>
        <div class="form-feedback" id="register-feedback" aria-live="polite"></div>
      </form>
    </div>

    <div slot="panel-2">
      <form class="form-panel" id="form-contact" novalidate aria-label="Contact form">
        <h2 style="font-size:1.3rem">Contact Us</h2>
        <div class="form-field">
          <label for="contact-name">Name</label>
          <input type="text" id="contact-name" placeholder="Your name" required />
        </div>
        <div class="form-field">
          <label for="contact-email">Email</label>
          <input type="email" id="contact-email" placeholder="you@example.com" required />
        </div>
        <div class="form-field">
          <label for="contact-subject">Subject</label>
          <input type="text" id="contact-subject" placeholder="How can we help?" required />
        </div>
        <div class="form-field">
          <label for="contact-msg">Message</label>
          <textarea id="contact-msg" rows="4" placeholder="Write your message…" required style="resize:vertical"></textarea>
        </div>
        <button type="submit" style="width:100%">Send Message</button>
        <div class="form-feedback" id="contact-feedback" aria-live="polite"></div>
      </form>
    </div>

    <div slot="panel-3">
      <form class="form-panel" id="form-survey" novalidate aria-label="Survey form" style="max-width:600px">
        <h2 style="font-size:1.3rem">Quick Survey</h2>
        <div class="form-field">
          <label for="survey-role">Your Role</label>
          <select id="survey-role" required>
            <option value="">Select a role…</option>
            <option>Frontend Developer</option>
            <option>Backend Developer</option>
            <option>Full-Stack Developer</option>
            <option>Designer</option>
            <option>DevOps</option>
            <option>Other</option>
          </select>
        </div>
        <fieldset style="border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:grid;gap:8px">
          <legend style="font-weight:600;color:var(--text-secondary);font-size:0.88rem;padding:0 6px">Topics you enjoy</legend>
          <label style="display:flex;gap:10px;align-items:center;cursor:pointer"><input type="checkbox" value="vanilla"> Vanilla JS</label>
          <label style="display:flex;gap:10px;align-items:center;cursor:pointer"><input type="checkbox" value="webapis"> Browser APIs</label>
          <label style="display:flex;gap:10px;align-items:center;cursor:pointer"><input type="checkbox" value="graphics"> Graphics / 3D</label>
          <label style="display:flex;gap:10px;align-items:center;cursor:pointer"><input type="checkbox" value="ai"> AI / ML</label>
        </fieldset>
        <div class="form-field">
          <label for="survey-rating">Rating (1–5)</label>
          <input type="range" id="survey-rating" min="1" max="5" value="3" style="padding:4px 0;accent-color:var(--accent)" />
          <span id="survey-rating-val" style="font-size:0.9rem;color:var(--text-secondary)">3 / 5</span>
        </div>
        <button type="submit" style="width:100%">Submit Survey</button>
        <div class="form-feedback" id="survey-feedback" aria-live="polite"></div>
      </form>
    </div>
  </app-tabs>
</section>
