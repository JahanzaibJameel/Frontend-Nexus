<section class="page-shell">
  <div class="page-header">
    <h1>Charts</h1>
    <p>Full ApexCharts showcase — 8 chart types with live, interactive data.</p>
  </div>

  <app-tabs id="charts-tabs" labels='["Line","Area","Bar","Pie","Donut","Radar","Heatmap","Timeline"]'>
    <div slot="panel-0"><div class="chart-panel"><div id="chart-line"></div></div></div>
    <div slot="panel-1"><div class="chart-panel"><div id="chart-area"></div></div></div>
    <div slot="panel-2"><div class="chart-panel"><div id="chart-bar"></div></div></div>
    <div slot="panel-3"><div class="chart-panel"><div id="chart-pie"></div></div></div>
    <div slot="panel-4"><div class="chart-panel"><div id="chart-donut"></div></div></div>
    <div slot="panel-5"><div class="chart-panel"><div id="chart-radar"></div></div></div>
    <div slot="panel-6"><div class="chart-panel"><div id="chart-heatmap"></div></div></div>
    <div slot="panel-7"><div class="chart-panel"><div id="chart-timeline"></div></div></div>
  </app-tabs>
</section>
