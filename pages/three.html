<section class="page-shell">
  <div class="page-header">
    <h1>Three.js</h1>
    <p>GPU-accelerated 3D scenes with OrbitControls. Click and drag to orbit, scroll to zoom.</p>
  </div>

  <div class="three-card">
    <canvas id="three-canvas" class="three-root" aria-label="3D scene" role="img"></canvas>
    <div class="three-toolbar">
      <select id="three-scene" aria-label="Select 3D scene" style="width:auto">
        <option value="cube">Rotating Cube</option>
        <option value="wireframe">Wireframe Globe</option>
        <option value="particles">Particle Field</option>
        <option value="earth">Earth Globe</option>
      </select>
      <button id="three-reset-cam" class="btn-secondary btn-sm" aria-label="Reset camera">↺ Reset Camera</button>
    </div>
  </div>
</section>
