<section class="page-shell">
  <div class="page-header" style="display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 16px;">
    <div>
      <h1>SortableJS Kanban Board</h1>
      <p>Interactive drag-and-drop workflow powered by SortableJS with LocalStorage state persistence.</p>
    </div>
    <div>
      <button id="add-kanban-btn" class="btn btn-primary" style="padding: 10px 20px; background: var(--accent); color: #0f172a; font-weight: 700; border-radius: 10px; border: none; cursor: pointer;">
        + Add New Task
      </button>
    </div>
  </div>

  <div class="kanban-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-top: 24px;">
    <!-- Column 1: To Do -->
    <div class="kanban-col" style="background: var(--bg-surface); border-radius: 16px; border: 1px solid var(--border); padding: 16px; display: flex; flex-direction: column;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 style="margin: 0; font-size: 1.1rem; color: var(--text-primary); font-weight: 700;">📌 To Do</h3>
        <span class="badge col-count" id="todo-count" style="background: rgba(56,189,248,0.15); color: var(--accent);">0</span>
      </div>
      <div class="kanban-list" id="col-todo" data-col="todo" style="flex: 1; min-height: 250px; display: flex; flex-direction: column; gap: 12px; padding: 4px;"></div>
    </div>

    <!-- Column 2: In Progress -->
    <div class="kanban-col" style="background: var(--bg-surface); border-radius: 16px; border: 1px solid var(--border); padding: 16px; display: flex; flex-direction: column;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 style="margin: 0; font-size: 1.1rem; color: var(--text-primary); font-weight: 700;">⚡ In Progress</h3>
        <span class="badge col-count" id="progress-count" style="background: rgba(245,158,11,0.15); color: #f59e0b;">0</span>
      </div>
      <div class="kanban-list" id="col-progress" data-col="progress" style="flex: 1; min-height: 250px; display: flex; flex-direction: column; gap: 12px; padding: 4px;"></div>
    </div>

    <!-- Column 3: Review -->
    <div class="kanban-col" style="background: var(--bg-surface); border-radius: 16px; border: 1px solid var(--border); padding: 16px; display: flex; flex-direction: column;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 style="margin: 0; font-size: 1.1rem; color: var(--text-primary); font-weight: 700;">🔍 Review</h3>
        <span class="badge col-count" id="review-count" style="background: rgba(168,85,247,0.15); color: #a855f7;">0</span>
      </div>
      <div class="kanban-list" id="col-review" data-col="review" style="flex: 1; min-height: 250px; display: flex; flex-direction: column; gap: 12px; padding: 4px;"></div>
    </div>

    <!-- Column 4: Done -->
    <div class="kanban-col" style="background: var(--bg-surface); border-radius: 16px; border: 1px solid var(--border); padding: 16px; display: flex; flex-direction: column;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 style="margin: 0; font-size: 1.1rem; color: var(--text-primary); font-weight: 700;">✅ Done</h3>
        <span class="badge col-count" id="done-count" style="background: rgba(16,185,129,0.15); color: #10b981;">0</span>
      </div>
      <div class="kanban-list" id="col-done" data-col="done" style="flex: 1; min-height: 250px; display: flex; flex-direction: column; gap: 12px; padding: 4px;"></div>
    </div>
  </div>
</section>
